<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpequiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Dallah Digital VMS</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      
      /* RTL layout support - force row-reverse on main container when RTL */
      /* Target by data-rtl attribute (most reliable for React Native Web) */
      [data-rtl="true"] {
        flex-direction: row-reverse !important;
      }
      /* Target by id (from nativeID) */
      [dir="rtl"] #main-container {
        flex-direction: row-reverse !important;
      }
      /* Target by data-testid (from testID) */
      [dir="rtl"] [data-testid="main-container"] {
        flex-direction: row-reverse !important;
      }
    </style>
    <script>
      // Set RTL direction before first paint based on stored language
      (function() {
        try {
          var lang = localStorage.getItem('@vms_language');
          if (lang === 'ar') {
            document.documentElement.dir = 'rtl';
            document.documentElement.lang = 'ar';
          }
        } catch(e) {}
      })();
    </script>
    <style>
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
