<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta httpequiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Dallah Digital VMS</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'FS Albert Arabic';
      src: url('/assets/fonts/arabic/alfont_com_AlFont_com_FSAlbertArabic-Thin.ttf') format('truetype');
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FS Albert Arabic';
      src: url('/assets/fonts/arabic/alfont_com_AlFont_com_FSAlbertArabic-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FS Albert Arabic';
      src: url('/assets/fonts/arabic/alfont_com_AlFont_com_FSAlbertArabic-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FS Albert Arabic';
      src: url('/assets/fonts/arabic/alfont_com_AlFont_com_FSAlbertArabic-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FS Albert Arabic';
      src: url('/assets/fonts/arabic/alfont_com_AlFont_com_FSAlbertArabic-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
    }

    #root {
      display: flex;
      height: 100%;
      flex: 1;
    }
  </style>
  <!-- 
      RTL is handled purely by DirectionalRow component in JavaScript.
      No document.dir='rtl' needed - this ensures single source of truth.
    -->
  <style>
    /* Override browser default blue focus ring with Dallah Orange theme */
    /* Always provide a visible focus indicator for accessibility */
    input:focus,
    textarea:focus,
    select:focus,
    button:focus {
      outline: 2px solid #F58423 !important;
      outline-offset: -2px;
    }

    /* Remove default webkit appearance for inputs */
    input,
    textarea,
    select {
      -webkit-tap-highlight-color: rgba(245, 132, 35, 0.2);
    }

    /* Override any blue selection/highlight colors */
    ::selection {
      background-color: rgba(245, 132, 35, 0.3);
    }

    ::-moz-selection {
      background-color: rgba(245, 132, 35, 0.3);
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
