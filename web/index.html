<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpequiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Dallah Digital VMS</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      
      /* RTL layout support - using data-locale and data-rtl attributes */
      /* Main container uses row-reverse for Arabic layout */
      [data-rtl="true"] {
        flex-direction: row-reverse !important;
      }
      /* Content area gets RTL text direction for proper Arabic text alignment */
      [data-content="true"][data-rtl="true"] {
        direction: rtl !important;
      }
    </style>
    <script>
      // Set language before first paint based on stored language
      // Always keep dir="ltr" to prevent double-reversal of flex layouts
      // RTL layout is handled explicitly via flexDirection in components
      (function() {
        try {
          var lang = localStorage.getItem('@vms_language');
          document.documentElement.dir = 'ltr'; // Always LTR
          document.documentElement.setAttribute('data-locale', lang || 'en');
          if (lang === 'ar') {
            document.documentElement.lang = 'ar';
          }
        } catch(e) {}
      })();
    </script>
    <style>
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
