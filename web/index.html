<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpequiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Dallah Digital VMS</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <script>
      // Set RTL direction before first paint based on stored language
      (function() {
        try {
          var lang = localStorage.getItem('@vms_language');
          if (lang === 'ar') {
            document.documentElement.dir = 'rtl';
            document.documentElement.lang = 'ar';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      /* Override browser default blue focus ring with Dallah Orange theme */
      /* Always provide a visible focus indicator for accessibility */
      input:focus,
      textarea:focus,
      select:focus,
      button:focus {
        outline: 2px solid #F58423 !important;
        outline-offset: -2px;
      }
      
      /* Remove default webkit appearance for inputs */
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: rgba(245, 132, 35, 0.2);
      }
      
      /* Override any blue selection/highlight colors */
      ::selection {
        background-color: rgba(245, 132, 35, 0.3);
      }
      
      ::-moz-selection {
        background-color: rgba(245, 132, 35, 0.3);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
